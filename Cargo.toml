[workspace]
members = ["agent", "model", "oxvm-sdk", "server", "xtask"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
attest-data = { git = "https://github.com/oxidecomputer/dice-util" }
base64 = "0.22"
bytes = "1.11.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive", "string"] }
config = { version = "0.15", features = ["toml"] }
const-oid = { version = "0.9.5", features = ["db"] }
derive_builder = "0.20.2"
dice-verifier = { git = "https://github.com/oxidecomputer/dice-util" }
dropshot = "0.17"
futures = "0.3"
hex = "0.4.3"
http = "1.4.0"
hubpack = "0.1.2"
jsonwebtoken = "10.3.0"
newline-converter = "0.3.0"
newtype-uuid = { version = "1.3.2", features = ["schemars08", "v4", "serde"] }
partial-struct = { git = "https://github.com/oxidecomputer/partial-struct" }
progenitor = { version = "0.13" }
progenitor-client = { version = "0.13" }
regex = "1.12.3"
reqwest = "0.13"
rsa = "0.9.10"
rustls = { version = "0.23.37", default-features = false, features = ["ring"] }
rustfmt-wrapper = "0.2.1"
schemars = { version = "0.8.21", features = ["chrono"] }
secrecy = "0.10.3"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
similar = "2.7.0"
slog = "2.8.2"
slog-async = "2.8.0"
sqlx = { version = "0.8", features = ["chrono", "json", "uuid", "postgres", "runtime-tokio", "tls-rustls", "migrate"] }
tap = "1.0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-slog = { git = "https://github.com/oxidecomputer/tracing-slog", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde"] }
v-api = { git = "https://github.com/oxidecomputer/v-api", tag = "v0.3.0-alpha.6" }
v-api-installer = { git = "https://github.com/oxidecomputer/v-api", tag = "v0.3.0-alpha.6" }
v-api-param = { git = "https://github.com/oxidecomputer/v-api", tag = "v0.3.0-alpha.6" }
v-api-permission-derive = { git = "https://github.com/oxidecomputer/v-api", tag = "v0.3.0-alpha.6" }
v-model = { git = "https://github.com/oxidecomputer/v-api", tag = "v0.3.0-alpha.6" }
vm-attest = { git = "https://github.com/oxidecomputer/vm-attest" }
lib-vsock = { package = "vsock", version = "0.5.3" }
x509-cert = "0.2.5"
