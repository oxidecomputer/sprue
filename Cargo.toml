[workspace]
members = ["sprue-agent", "sprue-api", "sprue-cli", "sprue-model", "sprue-sdk", "xtask"]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"
version = "0.3.4"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
attest-data = { git = "https://github.com/oxidecomputer/dice-util", rev = "d7472bfa91aee859c3fe0bdc1dbb1e320285228e" }
aws-config = { version = "1.10", features = ["behavior-version-latest"] }
aws-credential-types = "1.3"
# The default features of the AWS SDK crates enable the legacy `rustls` feature, which pins
# rustls 0.21 (and therefore ring). `default-https-client` provides the rustls + aws-lc-rs client.
aws-sdk-s3 = { version = "1.141", default-features = false, features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }
aws-sdk-sts = { version = "1.110", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "sigv4a",
] }
aws-smithy-mocks = "0.3"
aws-smithy-types = "1.6"
base64 = "0.22"
btreemultimap = "0.1.1"
bytes = "1.11.1"
cedar-policy = "4.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive", "string"] }
clap_complete = "4.5"
config = { version = "0.15", features = ["toml"] }
crossterm = "0.28"
const-oid = { version = "0.9.5", features = ["db"] }
ctrlc = "3.5"
derive_builder = "0.20.2"
dice-verifier = { git = "https://github.com/oxidecomputer/dice-util", rev = "d7472bfa91aee859c3fe0bdc1dbb1e320285228e" }
dirs = "6.0.0"
dropshot = "0.17"
futures = "0.3"
futures-util = "0.3.32"
hex = "0.4.3"
http = "1.4.0"
http-body-util = "0.1.3"
hubpack = "0.1.2"
hyper = "1.9.0"
itertools = "0.14.0"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
lazy_static = "1.4"
multimap = "0.10.1"
nanoid = "0.4.0"
newline-converter = "0.3.0"
newtype-uuid = { version = "1.3.2", features = ["schemars08", "v4", "serde"] }
oauth2 = { version = "5.0.0", default-features = false }
oauth2-reqwest = "0.1.0-alpha.3"
owo-colors = "4.2.3"
partial-struct = { git = "https://github.com/oxidecomputer/partial-struct" }
progenitor = { version = "0.14" }
progenitor-client = { version = "0.14" }
rand = "0.10.1"
ratatui = "0.29"
regex = "1.12.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
rsa = "0.9.10"
rustls = { version = "0.23.37", default-features = false, features = ["aws-lc-rs"] }
rustfmt-wrapper = "0.2.1"
schemars = { version = "0.8.21", features = ["chrono"] }
secrecy = "0.10.3"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
similar = "2.7.0"
slog = "2.8.2"
slog-async = "2.8.0"
sqlx = { version = "0.8", features = ["chrono", "json", "uuid", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "migrate"] }
steno = { git = "https://github.com/oxidecomputer/steno" }
strum = { version = "0.28.0", features = ["derive"] }
tabwriter = "1.4.1"
tap = "1.0.1"
tarpc = { version = "0.37.0", features = ["serde", "serde-transport-json", "unix"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9.12"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-slog = { git = "https://github.com/oxidecomputer/tracing-slog", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde"] }
v-api = { git = "https://github.com/oxidecomputer/v-api", rev = "v0.4.15" }
v-api-param = { git = "https://github.com/oxidecomputer/v-api", rev = "v0.4.15" }
v-api-permission-derive = { git = "https://github.com/oxidecomputer/v-api", rev = "v0.4.15" }
v-cli-sdk = { git = "https://github.com/oxidecomputer/v-api", rev = "v0.4.15" }
v-model = { git = "https://github.com/oxidecomputer/v-api", rev = "v0.4.15" }
vm-attest = { git = "https://github.com/oxidecomputer/vm-attest", rev = "ef821ea699c63154b04cbea90861981f92a601c2" }
lib-vsock = { package = "vsock", version = "0.5.3" }
x509-cert = "0.2.5"
zip = "8.6.0"

